<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>표본실 · 머리뼈 암기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --ink:#0D1417; --ink2:#141E22; --ink3:#1D2A30; --ink4:#26363D;
  --bone:#EDE3D0; --bone-dim:#A9A08D; --slate:#728891;
  --nerve:#E3C24C; --artery:#C0483E; --vein:#4E86B0;
  --line:rgba(237,227,208,.11); --line2:rgba(237,227,208,.20);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sheet-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);
  font-size:15px;line-height:1.5;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.on{display:flex}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.latin{font-family:var(--serif);font-style:italic}

/* ── home ───────────────────────────── */
.home-pad{padding:calc(env(safe-area-inset-top) + 30px) 20px 40px}
.mast{border-bottom:1px solid var(--line2);padding-bottom:18px;margin-bottom:22px}
.mast h1{
  font-family:var(--serif);font-weight:600;font-size:29px;letter-spacing:-.01em;
  margin:8px 0 2px;line-height:1.15;
}
.mast .sub{color:var(--slate);font-size:12.5px;margin:0}
.due-strip{
  display:flex;align-items:baseline;gap:10px;padding:13px 15px;margin-bottom:24px;
  background:var(--ink2);border-left:2px solid var(--nerve);border-radius:0 6px 6px 0;
}
.due-strip b{font-family:var(--mono);font-size:22px;color:var(--nerve);font-weight:500;line-height:1}
.due-strip span{font-size:13px;color:var(--bone-dim)}

.ch{
  display:block;width:100%;text-align:left;padding:16px 0;
  border-bottom:1px solid var(--line);position:relative;
}
.ch:first-of-type{border-top:1px solid var(--line)}
.ch-top{display:flex;align-items:center;gap:12px}
.ch-title{font-size:16.5px;font-weight:600;letter-spacing:-.01em;flex:1}
.ch-sub{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--slate);margin-top:1px}
.ch-meter{display:flex;gap:3px;margin-top:11px}
.ch-meter i{height:3px;flex:1;background:var(--ink4);border-radius:2px}
.ch-meter i.f{background:var(--nerve)}
.ch-meter i.p{background:rgba(227,194,76,.38)}
.ch-count{font-family:var(--mono);font-size:11px;color:var(--slate)}

.modes{display:none;gap:8px;padding:4px 0 16px;flex-wrap:wrap}
.ch.open + .modes{display:flex}
.mode-btn{
  padding:9px 14px;border:1px solid var(--line2);border-radius:20px;font-size:13px;
  color:var(--bone-dim);transition:.15s;
}
.mode-btn:active{transform:scale(.96)}
.mode-btn.hot{border-color:var(--nerve);color:var(--nerve)}
.mode-btn[disabled]{opacity:.3}

.footlinks{margin-top:34px;display:flex;gap:18px}
.footlinks button{font-size:12.5px;color:var(--slate);border-bottom:1px solid var(--line2);padding-bottom:2px}

/* ── quiz ───────────────────────────── */
.qbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);
}
.qbar .back{font-size:19px;color:var(--slate);width:30px;margin-left:-6px}
.qbar .who{flex:1;min-width:0}
.qbar .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .who span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.qbar .count{font-family:var(--mono);font-size:12px;color:var(--slate);letter-spacing:.04em}
.qbar .count b{color:var(--bone);font-weight:500}

.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
.viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
.canvas{position:relative;transform-origin:50% 50%;will-change:transform}
.canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:0;height:0}
.pin::before{
  content:"";position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--nerve);background:rgba(13,20,23,.55);
}
.pin.live::after{
  content:"";position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--nerve);animation:ping 1.6s ease-out infinite;
}
.pin.ghost::before{border-color:var(--slate);opacity:.45}
.pin.hit::before{border-color:var(--nerve);background:var(--nerve)}
.pin.miss::before{border-color:var(--artery);background:rgba(192,72,62,.35)}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.live::after{animation:none}}
.tapmark{position:absolute;width:0;height:0}
.tapmark::before{
  content:"";position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
  border:1.5px dashed var(--artery);
}
.stage-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:30px;color:var(--slate);font-size:13px;
}
.zoomhint{
  position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;color:var(--slate);opacity:.55;pointer-events:none;
}

/* ── sheet ──────────────────────────── */
#scr-quiz.noimg .sheet{flex:1;border-top:0}
.sheet{
  background:var(--ink2);border-top:1px solid var(--line2);
  padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);
  box-shadow:0 -14px 40px rgba(0,0,0,.45);
}
.prompt{margin:0 0 12px;font-size:15px;line-height:1.45}
.prompt em{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--nerve);font-size:17px}
.prompt .ko{color:var(--bone-dim);font-size:13px}
.askrow{display:flex;gap:8px}
#answer{
  flex:1;min-width:0;background:var(--ink);border:1px solid var(--line2);border-radius:8px;
  padding:12px 13px;font-size:16px;font-family:var(--serif);outline:none;
}
#answer:focus{border-color:var(--nerve)}
#answer::placeholder{color:#4E6068;font-family:var(--sans);font-size:14px}
.go{
  padding:0 18px;border-radius:8px;background:var(--nerve);color:#15100A;
  font-weight:700;font-size:14px;letter-spacing:-.01em;
}
.go:active{transform:scale(.97)}
.subrow{display:flex;gap:14px;margin-top:11px}
.subrow button{font-size:12.5px;color:var(--slate)}
.subrow button:active{color:var(--bone-dim)}

.verdict{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.verdict .tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;
}
.tag.ok{background:rgba(227,194,76,.15);color:var(--nerve)}
.tag.no{background:rgba(192,72,62,.18);color:#E38078}
.verdict .yours{font-size:12px;color:var(--slate)}
.verdict .yours s{color:#8A5F5A}
.ansline{font-family:var(--serif);font-style:italic;font-weight:600;font-size:21px;line-height:1.25;margin:0}
.ansko{font-size:13px;color:var(--bone-dim);margin:2px 0 0}
.through{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.through .eyebrow{margin-bottom:7px;display:block}
.through ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.through li{font-family:var(--serif);font-size:14px;display:flex;align-items:baseline;gap:8px}
.through li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--slate);flex:none;transform:translateY(-2px)}
.through li.n::before{background:var(--nerve)}
.through li.a::before{background:var(--artery)}
.through li.v::before{background:var(--vein)}
.alsoin{margin-top:9px;font-size:12px;color:var(--slate)}
.alsoin b{color:var(--bone-dim);font-family:var(--serif);font-style:italic;font-weight:400}
.nextrow{display:flex;gap:8px;margin-top:15px}
.nextrow .go{flex:1;padding:12px}
.ghostbtn{
  padding:12px 15px;border:1px solid var(--line2);border-radius:8px;
  font-size:13px;color:var(--bone-dim);
}

/* ── done / settings ────────────────── */
.pad{padding:calc(env(safe-area-inset-top) + 26px) 20px 40px}
.done-num{font-family:var(--mono);font-size:46px;color:var(--nerve);line-height:1;font-weight:500}
.done h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:16px 0 6px}
.done p{color:var(--bone-dim);font-size:13.5px;margin:0 0 26px}
.missed{border-top:1px solid var(--line);padding-top:14px;margin-bottom:26px}
.missed li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-style:italic;font-size:14.5px}
.missed ul{margin:0;padding:0}
.missed li span{font-family:var(--sans);font-style:normal;font-size:12px;color:var(--slate);margin-left:8px}

.setrow{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.setrow p{margin:0;font-size:14px}
.setrow small{display:block;color:var(--slate);font-size:11.5px;margin-top:2px}
.setrow button{
  padding:8px 13px;border:1px solid var(--line2);border-radius:6px;font-size:12.5px;color:var(--bone-dim);flex:none;
}
.setrow button.danger{color:#E38078;border-color:rgba(192,72,62,.4)}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
  background:var(--ink4);color:var(--bone);padding:10px 16px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap;
}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--nerve);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ══ HOME ══ -->
  <section id="scr-home" class="screen on">
    <div class="home-pad">
      <div class="mast">
        <span class="eyebrow">Osteology · Skull</span>
        <h1>표본실</h1>
        <p class="sub">지점을 짚고, 이름을 떠올리고, 통과물까지.</p>
      </div>
      <div class="due-strip"><b id="dueN">0</b><span>개가 오늘 복습 예정입니다</span></div>
      <div id="chapters"></div>
      <div class="footlinks">
        <button data-go="settings">진도 · 설정</button>
        <button onclick="location.href='editor.html'">문항 에디터</button>
      </div>
    </div>
  </section>

  <!-- ══ QUIZ ══ -->
  <section id="scr-quiz" class="screen">
    <div class="qbar">
      <button class="back" data-go="home" aria-label="나가기">←</button>
      <div class="who"><b id="qTitle"></b><span id="qMode"></span></div>
      <div class="count"><b id="qNow">1</b>/<span id="qAll">10</span></div>
    </div>
    <div class="stage" id="stage">
      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
          <img id="plate" alt="">
          <svg id="leader" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="pins"></div>
        </div>
      </div>
      <div class="stage-empty" id="stageEmpty" hidden></div>
      <div class="zoomhint" id="zoomHint">두 손가락 확대 · 두 번 탭 원위치</div>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <!-- ══ DONE ══ -->
  <section id="scr-done" class="screen">
    <div class="pad done">
      <div class="done-num" id="doneScore">0/0</div>
      <h2 id="doneHead">한 바퀴 끝</h2>
      <p id="doneSub"></p>
      <div class="missed" id="missedBox" hidden>
        <span class="eyebrow">다시 볼 것</span>
        <ul id="missedList"></ul>
      </div>
      <div class="nextrow">
        <button class="go" id="againBtn">한 번 더</button>
        <button class="ghostbtn" data-go="home">목록으로</button>
      </div>
    </div>
  </section>

  <!-- ══ SETTINGS ══ -->
  <section id="scr-settings" class="screen">
    <div class="pad">
      <div class="mast">
        <span class="eyebrow">Data</span>
        <h1>진도 · 설정</h1>
      </div>
      <div class="setrow">
        <p>진도 내보내기<small>기기를 바꾸거나 캐시를 지우기 전에</small></p>
        <button id="expBtn">파일로 저장</button>
      </div>
      <div class="setrow">
        <p>진도 가져오기<small>내보낸 json 파일을 불러옵니다</small></p>
        <button id="impBtn">파일 열기</button>
        <input type="file" id="impFile" accept="application/json" hidden>
      </div>
      <div class="setrow">
        <p>정답 진동<small>맞고 틀릴 때 짧게 울립니다</small></p>
        <button id="hapBtn">켜짐</button>
      </div>
      <div class="setrow">
        <p>진도 초기화<small>모든 복습 기록이 사라집니다</small></p>
        <button class="danger" id="wipeBtn">초기화</button>
      </div>
      <div class="footlinks"><button data-go="home">← 돌아가기</button></div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="data/chapters.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "skullquiz.v1";
const MODES = {
  pin2name:  { label:"핀 → 이름", short:"Pin → Name" },
  name2pin:  { label:"이름 → 핀", short:"Name → Pin" },
  contents:  { label:"통과물 → 구멍", short:"Contents → Opening" }
};
const BOX_DAYS = [0, 0, 1, 3, 7, 21];   // box 1..5
const HIT_R = 0.062;                     // name2pin 허용 반경 (정규화)
const CHAPTERS = window.CHAPTERS || [];

/* ── 저장소 ─────────────────────────── */
let db = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.srs) return r; }catch(e){}
  return { srs:{}, settings:{ haptics:true } };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function srsOf(cid, iid){
  const k = cid+"/"+iid;
  return db.srs[k] || (db.srs[k] = { box:1, due:0, seen:0, miss:0 });
}
function grade(cid, iid, right){
  const s = srsOf(cid, iid);
  s.seen++;
  if(right){ s.box = Math.min(5, s.box + 1); }
  else { s.box = 1; s.miss++; }
  s.due = Date.now() + BOX_DAYS[s.box] * 864e5;
  save();
}
function dueCount(){
  const now = Date.now(); let n = 0;
  for(const ch of CHAPTERS) for(const it of ch.items){
    const s = db.srs[ch.id+"/"+it.id];
    if(!s || s.due <= now) n++;
  }
  return n;
}

/* ── 채점 ───────────────────────────── */
function norm(s){
  return (s||"").toLowerCase()
    .replace(/\(.*?\)/g," ")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9가-힣]/g,"");
}
function lev(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
// 반환: "exact" | "typo" | null
function match(input, accepted){
  const q = norm(input);
  if(!q) return null;
  let best = null;
  for(const a of accepted){
    const t = norm(a);
    if(!t) continue;
    if(t === q) return "exact";
    const tol = t.length <= 6 ? 1 : (t.length <= 12 ? 2 : 3);
    if(lev(q, t) <= tol) best = "typo";
    // 마지막 낱말만 쳐도 인정 (foramen ovale → ovale)
    const tail = norm(a.split(/\s+/).pop());
    if(tail.length >= 5 && tail === q) best = best || "typo";
  }
  return best;
}

/* ── 통과물 역색인 ──────────────────── */
const REV = new Map();   // norm(structure) -> { label, openings:[{chId,item}] }
for(const ch of CHAPTERS) for(const it of ch.items){
  for(const c of (it.contents || [])){
    const k = norm(c);
    if(!REV.has(k)) REV.set(k, { label:c, openings:[] });
    REV.get(k).openings.push({ chId: ch.id, item: it });
  }
}
function vesselKind(s){
  const t = s.toLowerCase();
  if(/\bnerve|nerves|\bn\.|cn |root of|plexus|fibers|medulla/.test(t)) return "n";
  if(/artery|arteries|\ba\./.test(t)) return "a";
  if(/vein|veins|sinus|venous/.test(t)) return "v";
  return "";
}

/* ── 화면 전환 ──────────────────────── */
function show(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#scr-"+name).classList.add("on");
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g) show(g.dataset.go);
});
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 1900);
}
function buzz(ms){
  if(db.settings.haptics && navigator.vibrate) navigator.vibrate(ms);
}

/* ── 홈 ─────────────────────────────── */
function renderHome(){
  $("#dueN").textContent = dueCount();
  const box = $("#chapters"); box.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const mastered = ch.items.filter(it => (db.srs[ch.id+"/"+it.id]||{}).box >= 5).length;
    const started  = ch.items.filter(it => { const s=db.srs[ch.id+"/"+it.id]; return s && s.box>1 && s.box<5; }).length;

    const btn = document.createElement("button");
    btn.className = "ch";
    btn.innerHTML = `
      <div class="ch-top">
        <div style="flex:1">
          <div class="ch-title">${ch.title}</div>
          <div class="ch-sub">${ch.subtitle||""}</div>
        </div>
        <div class="ch-count">${mastered}/${ch.items.length}</div>
      </div>
      <div class="ch-meter">${ch.items.map((it,i)=>{
        const b=(db.srs[ch.id+"/"+it.id]||{}).box||1;
        return `<i class="${b>=5?"f":(b>1?"p":"")}"></i>`;
      }).join("")}</div>`;

    const modes = document.createElement("div");
    modes.className = "modes";
    const hasImg = !!ch.image && ch.items.some(it => it.x != null);
    const hasCon = ch.items.some(it => it.contents && it.contents.length);
    modes.innerHTML = `
      <button class="mode-btn hot" data-m="pin2name" ${hasImg?"":"disabled"}>${MODES.pin2name.label}</button>
      <button class="mode-btn" data-m="name2pin" ${hasImg?"":"disabled"}>${MODES.name2pin.label}</button>
      <button class="mode-btn" data-m="contents" ${hasCon?"":"disabled"}>${MODES.contents.label}</button>`;
    modes.onclick = e => {
      const b = e.target.closest("[data-m]");
      if(b && !b.disabled) start(ch, b.dataset.m);
    };

    btn.onclick = () => {
      const wasOpen = btn.classList.contains("open");
      box.querySelectorAll(".ch").forEach(c=>c.classList.remove("open"));
      if(!wasOpen) btn.classList.add("open");
    };
    box.append(btn, modes);
  });
}

/* ── 세션 ───────────────────────────── */
let S = null;   // 현재 세션

function start(ch, mode){
  let pool = ch.items.filter(it => mode === "contents"
      ? (it.contents && it.contents.length)
      : (it.x != null && it.y != null));
  if(!pool.length){ toast("이 모드로 풀 문항이 없습니다"); return; }

  const now = Date.now();
  pool = pool.slice().sort((a,b) => {
    const sa = db.srs[ch.id+"/"+a.id] || {due:0,box:1};
    const sb = db.srs[ch.id+"/"+b.id] || {due:0,box:1};
    return (sa.due - sb.due) || (sa.box - sb.box);
  }).slice(0, 20);
  shuffle(pool);

  S = { ch, mode, queue: pool.map(it=>({item:it, retry:false})),
        i:0, total: pool.length, right:0, missed:[], answered:false, target:null };

  $("#qTitle").textContent = ch.title;
  $("#qMode").textContent  = MODES[mode].short;
  $("#qAll").textContent   = S.total;

  const useImg = mode !== "contents";
  $("#scr-quiz").classList.toggle("noimg", !useImg);
  $("#stage").style.display = useImg ? "" : "none";
  $("#zoomHint").hidden = !useImg;
  if(useImg){
    const p = $("#plate");
    if(p.getAttribute("src") !== ch.image){ p.src = ch.image; }
    resetView();
  }
  show("quiz");
  nextQ();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function nextQ(){
  if(S.i >= S.queue.length){ finish(); return; }
  const q = S.queue[S.i];
  S.answered = false;
  S.target = q.item;
  S.tap = null;
  $("#qNow").textContent = S.i + 1;
  $("#qAll").textContent = S.queue.length;

  if(S.mode === "contents") renderContentsQ(q.item);
  else renderImageQ(q.item);
}

function finish(){
  const pct = S.total ? Math.round(S.right / S.total * 100) : 0;
  $("#doneScore").textContent = S.right + "/" + S.total;
  $("#doneHead").textContent = pct === 100 ? "전부 맞혔습니다" : (pct >= 70 ? "괜찮습니다" : "다시 한 바퀴 돌 차례");
  $("#doneSub").textContent = `${S.ch.title} · ${MODES[S.mode].label}`;
  const box = $("#missedBox"), list = $("#missedList");
  const uniq = [...new Map(S.missed.map(m=>[m.id,m])).values()];
  box.hidden = !uniq.length;
  list.innerHTML = uniq.map(m => `<li>${m.answer[0]}<span>${m.ko||""}</span></li>`).join("");
  $("#againBtn").onclick = () => start(S.ch, S.mode);
  renderHome();
  show("done");
}

/* ── 문제 렌더: 이미지 계열 ──────────── */
function renderImageQ(item){
  drawPins(item);
  if(S.mode === "pin2name"){
    drawLeader(item, null);
    $("#sheet").innerHTML = `
      <p class="prompt">표시된 지점의 이름은?</p>
      <div class="askrow">
        <input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off"
               spellcheck="false" placeholder="라틴어 또는 한글">
        <button class="go" id="goBtn">확인</button>
      </div>
      <div class="subrow">
        ${item.hint ? `<button id="hintBtn">힌트</button>` : ``}
        <button id="skipBtn">모르겠음</button>
      </div>`;
    wireAnswerInput(item);
  } else {
    clearLeader();
    $("#sheet").innerHTML = `
      <p class="prompt"><em>${item.answer[0]}</em>${item.ko?` <span class="ko">${item.ko}</span>`:""}</p>
      <p style="margin:0;font-size:13px;color:var(--slate)">그림에서 이 위치를 짚으세요.</p>
      <div class="subrow"><button id="skipBtn">모르겠음</button></div>`;
    $("#skipBtn").onclick = () => judgeImage(false, null);
  }
}

function wireAnswerInput(item){
  const inp = $("#answer");
  const submit = () => {
    if(S.answered) return;
    const v = inp.value.trim();
    if(!v){ inp.focus(); return; }
    const accepted = item.answer.concat(item.ko ? [item.ko] : []);
    const m = match(v, accepted);
    judgeImage(!!m, v, m === "typo");
  };
  $("#goBtn").onclick = submit;
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); }});
  $("#skipBtn").onclick = () => judgeImage(false, null);
  const hb = $("#hintBtn");
  if(hb) hb.onclick = () => { hb.outerHTML = `<span style="font-size:12.5px;color:var(--vein)">${item.hint}</span>`; };
  setTimeout(()=>inp.focus(), 60);
}

function judgeImage(right, typed, typo){
  if(S.answered) return;
  S.answered = true;
  const item = S.target;
  grade(S.ch.id, item.id, right);
  if(right){ S.right++; buzz(18); }
  else { S.missed.push(item); buzz([12,60,12]);
         S.queue.push({ item, retry:true }); }
  drawPins(item, right ? "hit" : "miss");
  drawLeader(item, item.answer[0]);
  revealCard({ right, typed, typo, item });
}

/* ── 문제 렌더: 통과물 ──────────────── */
function renderContentsQ(item){
  const struct = item.contents[(Math.random()*item.contents.length)|0];
  S.askedStruct = struct;
  const rec = REV.get(norm(struct));
  $("#sheet").innerHTML = `
    <p class="prompt"><em>${struct}</em><br><span class="ko">이 구조물이 지나가는 구멍·관·틈새는?</span></p>
    <div class="askrow">
      <input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="예: foramen ovale">
      <button class="go" id="goBtn">확인</button>
    </div>
    <div class="subrow"><button id="skipBtn">모르겠음</button></div>`;
  const inp = $("#answer");
  const submit = () => {
    if(S.answered) return;
    const v = inp.value.trim(); if(!v){ inp.focus(); return; }
    const accepted = rec.openings.flatMap(o => o.item.answer.concat(o.item.ko?[o.item.ko]:[]));
    const m = match(v, accepted);
    judgeContents(!!m, v, m === "typo", rec);
  };
  $("#goBtn").onclick = submit;
  inp.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); submit(); }});
  $("#skipBtn").onclick = () => judgeContents(false, null, false, rec);
  setTimeout(()=>inp.focus(), 60);
}

function judgeContents(right, typed, typo, rec){
  if(S.answered) return;
  S.answered = true;
  const item = S.target;
  grade(S.ch.id, item.id, right);
  if(right){ S.right++; buzz(18); }
  else { S.missed.push(item); buzz([12,60,12]); S.queue.push({ item, retry:true }); }
  revealCard({ right, typed, typo, item, rec });
}

/* ── 정답 카드 ──────────────────────── */
function revealCard({ right, typed, typo, item, rec }){
  const others = rec ? rec.openings.map(o=>o.item).filter(x => x.id !== item.id) : [];
  const contents = item.contents || [];

  $("#sheet").innerHTML = `
    <div class="verdict">
      <span class="tag ${right?"ok":"no"}">${right ? (typo?"오타 인정":"정답") : "오답"}</span>
      ${typed && !right ? `<span class="yours">입력 <s>${escapeHtml(typed)}</s></span>` : ""}
      ${typed && typo ? `<span class="yours">입력 ${escapeHtml(typed)}</span>` : ""}
    </div>
    <p class="ansline">${item.answer[0]}</p>
    ${item.ko ? `<p class="ansko">${item.ko}</p>` : ""}
    ${contents.length ? `
      <div class="through">
        <span class="eyebrow">통과물</span>
        <ul>${contents.map(c=>`<li class="${vesselKind(c)}">${c}</li>`).join("")}</ul>
      </div>` : ""}
    ${others.length ? `<p class="alsoin">같은 구조물이 지나는 다른 통로 — ${others.map(o=>`<b>${o.answer[0]}</b>`).join(", ")}</p>` : ""}
    <div class="nextrow">
      <button class="go" id="nextBtn">${S.i + 1 >= S.queue.length ? "결과 보기" : "다음"}</button>
      ${right ? `<button class="ghostbtn" id="unsureBtn">사실 헷갈렸음</button>` : ""}
    </div>`;

  $("#nextBtn").onclick = () => { S.i++; nextQ(); };
  const u = $("#unsureBtn");
  if(u) u.onclick = () => {
    const s = srsOf(S.ch.id, item.id);
    s.box = Math.max(1, s.box - 2); s.due = Date.now(); save();
    u.textContent = "다시 볼 목록에 넣었습니다"; u.disabled = true; u.style.opacity = .5;
    S.queue.push({ item, retry:true });
  };
  $("#nextBtn").focus({ preventScroll:true });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ── 핀 · 지시선 ────────────────────── */
function drawPins(target, state){
  const box = $("#pins"); box.innerHTML = "";
  if(S.tap){
    const m = document.createElement("div");
    m.className = "tapmark";
    m.style.left = S.tap.x*100 + "%"; m.style.top = S.tap.y*100 + "%";
    box.append(m);
  }
  if(S.mode === "pin2name"){
    const d = document.createElement("div");
    d.className = "pin " + (state || "live");
    d.style.left = target.x*100 + "%"; d.style.top = target.y*100 + "%";
    box.append(d);
  } else if(state){                       // name2pin, 채점 후에만 정답 위치 공개
    const d = document.createElement("div");
    d.className = "pin " + state;
    d.style.left = target.x*100 + "%"; d.style.top = target.y*100 + "%";
    box.append(d);
  }
}
function clearLeader(){ $("#leader").innerHTML = ""; }
function drawLeader(item, label){
  const img = $("#plate"), svg = $("#leader");
  const w = img.naturalWidth || 1000, h = img.naturalHeight || 1000;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const sw = w/430, fs = w/26;
  const px = item.x*w, py = item.y*h;
  const dir = item.x < 0.5 ? -1 : 1;
  const kx  = px + dir*w*0.13, ky = py + h*0.11;
  const ex  = kx + dir*w*0.14;
  const d   = `M${px} ${py} L${kx} ${ky} L${ex} ${ky}`;
  svg.innerHTML = `
    <path d="${d}" fill="none" stroke="#E3C24C" stroke-width="${sw}"
          stroke-linecap="round" stroke-linejoin="round" opacity=".85"
          stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="0.5s" fill="freeze"/>
    </path>
    ${label ? `<text x="${ex + dir*(w*0.02)}" y="${ky + fs*0.36}" fill="#EDE3D0"
        font-family="Spectral, Georgia, serif" font-style="italic" font-size="${fs}"
        text-anchor="${dir<0?"end":"start"}" opacity="0">${escapeHtml(label)}
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.35s" fill="freeze"/>
      </text>` : ""}`;
}

/* ── 확대 · 이동 · 탭 판정 ──────────── */
let view = { s:1, x:0, y:0 }, base = 1;
const canvas = $("#canvas"), viewport = $("#viewport"), plate = $("#plate");
function applyView(){
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
}
function resetView(){
  view = { s:1, x:0, y:0 };
  canvas.style.width = ""; applyView();
}
plate.addEventListener("load", () => { $("#stageEmpty").hidden = true; resetView(); if(S && S.target && S.mode==="pin2name") drawLeader(S.target, S.answered ? S.target.answer[0] : null); });
plate.addEventListener("error", () => {
  $("#stageEmpty").hidden = false;
  $("#stageEmpty").innerHTML = `<b style="color:var(--bone-dim)">이미지를 찾지 못했습니다</b>
    <span>${escapeHtml(S ? S.ch.image : "")} 파일을 확인하세요.</span>`;
});

let ptrs = new Map(), pinch = null, moved = 0, downAt = 0, lastTap = 0;
function clamp(){
  const r = viewport.getBoundingClientRect();
  const cw = canvas.offsetWidth * view.s, chh = canvas.offsetHeight * view.s;
  const mx = Math.max(0, (cw - r.width)/2 + 40), my = Math.max(0, (chh - r.height)/2 + 40);
  view.x = Math.min(mx, Math.max(-mx, view.x));
  view.y = Math.min(my, Math.max(-my, view.y));
}
viewport.addEventListener("pointerdown", e => {
  viewport.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  moved = 0; downAt = Date.now();
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), s: view.s };
  }
});
viewport.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId);
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  moved += Math.abs(dx) + Math.abs(dy);
  if(ptrs.size === 2 && pinch){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    view.s = Math.min(6, Math.max(1, pinch.s * (d / pinch.d)));
  } else if(view.s > 1.01){
    view.x += dx; view.y += dy;
  }
  clamp(); applyView();
});
function up(e){
  const wasTap = moved < 8 && Date.now() - downAt < 320 && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) pinch = null;
  if(!wasTap) return;
  if(view.s <= 1.01){ handleTap(e); return; }
  const now = Date.now();
  if(now - lastTap < 300){ lastTap = 0; resetView(); return; }
  lastTap = now;
  setTimeout(() => { if(lastTap) handleTap(e); }, 300);
}
viewport.addEventListener("pointerup", up);
viewport.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); pinch = null; });

function handleTap(e){
  lastTap = 0;
  if(!S || S.mode !== "name2pin" || S.answered) return;
  const r = plate.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  if(nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
  const t = S.target;
  const dist = Math.hypot(nx - t.x, ny - t.y);
  S.tap = { x:nx, y:ny };
  judgeImage(dist <= HIT_R, null);
}

/* ── 설정 ───────────────────────────── */
$("#hapBtn").onclick = e => {
  db.settings.haptics = !db.settings.haptics; save();
  e.target.textContent = db.settings.haptics ? "켜짐" : "꺼짐";
  if(db.settings.haptics) buzz(18);
};
$("#hapBtn").textContent = db.settings.haptics ? "켜짐" : "꺼짐";

$("#expBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `skullquiz-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("진도를 저장했습니다");
};
$("#impBtn").onclick = () => $("#impFile").click();
$("#impFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.srs) throw 0;
      db = Object.assign({ settings:{haptics:true} }, d); save();
      renderHome(); toast("진도를 불러왔습니다");
    }catch(err){ toast("이 파일은 읽을 수 없습니다"); }
  };
  r.readAsText(f);
  e.target.value = "";
};
$("#wipeBtn").onclick = () => {
  if(!confirm("모든 복습 기록을 지웁니다. 되돌릴 수 없습니다.")) return;
  db = { srs:{}, settings: db.settings }; save(); renderHome(); toast("초기화했습니다");
};

/* ── 시작 ───────────────────────────── */
if(!CHAPTERS.length){
  $("#chapters").innerHTML = `<p style="color:var(--slate);font-size:13px">
    data/chapters.js 를 읽지 못했습니다.</p>`;
}
renderHome();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
